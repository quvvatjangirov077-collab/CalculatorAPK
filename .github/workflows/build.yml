
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android APK yaratish
        uses: digreatbrian/buildozer-action@v2
        with:
          workdir: .
          buildozer_version: stable

      - name: APK faylini saqlash
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorAPK
          path: bin/*.apk
